# Mises à jour de dépendances (FORESTAR-236, R010-S02). Les correctifs et mineures arrivent
# groupés en UNE PR par écosystème et par semaine (le lundi) ; les montées majeures sont
# ignorées ici et se traitent à part, une à la fois, avec leur propre plan (D-09). Les PR de
# sécurité de Dependabot (réglage « Dependabot security updates » du dépôt) restent
# individuelles et prioritaires. Aucune fusion ni aucun déploiement automatiques : chaque PR
# passe la CI du dépôt et une revue humaine.
version: 2
registries:
  # Paquets @forestar-be/* (GitHub Packages) : jeton en lecture seule,
  # secret Dependabot DEPENDABOT_PACKAGES_TOKEN à créer par le PO.
  forestar-github-packages:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{secrets.DEPENDABOT_PACKAGES_TOKEN}}
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    registries: [forestar-github-packages]
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: chore(deps)
    groups:
      correctifs-et-mineures:
        update-types: [patch, minor]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: chore(deps)
    groups:
      correctifs-et-mineures:
        update-types: [patch, minor]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
